# ==========================================
# 基本設定 (General Settings)
# ==========================================

# スクロールバックバッファの行数を増やす
set -g history-limit 10000

# ウィンドウやペインのインデックスを1から開始する (キーボードの1キーに合わせるため)
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウが閉じられたらインデックスを自動で詰め重す
set -g renumber-windows on

# 端末のカラー設定 (256色・TrueColor対応)
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# フォーカスイベントを有効化 (Neovimなどのautoreadと連携するため)
set -g focus-events on

# Pi agent
set -g extended-keys on
set -g extended-keys-format csi-u

# ==========================================
# キーバインド設定 (Key Bindings)
# ==========================================

# プレフィックスキーを Ctrl + b から Ctrl + a に変更 (押しやすさ重視)
set -g prefix C-a
unbind C-b

# Ctrl + a を2回連続で押すことで、直前のアクティブなウィンドウ(タブ)と交互に切り替える
bind C-a last-window

# Defaultの 'Prefix + l' (last-window) を解除
unbind l

# 設定ファイルの再読み込みショートカット
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# 直感的な画面分割 (現在のペインのパスを引き継ぐ)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ペインを移動する
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R

# ペインをリサイズする (Prefix + 矢印キー)
bind Left  resize-pane -L 5
bind Right resize-pane -R 5
bind Up    resize-pane -U 5
bind Down  resize-pane -D 5

# Ctrl + 矢印キー(左右)でウィンドウ(タブ)を切り替える
bind -n C-Left previous-window
bind -n C-Right next-window

# Prefix + c で現在のディレクトリを引き継いで新しいウィンドウを作成する
bind c new-window -c "#{pane_current_path}"

# Prefix + m で現在のペインを最大化 / 元に戻す (Maximize)
bind m resize-pane -Z

# フォーカス移動時にアクティブペインを点滅させる 
# 点滅のあとは select-pane -P ではなく set -pu で、ペイン個別のスタイルを解除する。
# select-pane -P はそのペインの window-style と window-active-style の両方を書き換えて個別の指定を残すため、
# select-pane -P "bg=default" で戻すと、下の「ペインの見た目」で非アクティブなペインに付ける文字色が、
# 一度フォーカスしたペインに効かなくなる
set-hook -g pane-focus-in 'select-pane -P "bg=colour238"; run-shell "sleep 0.1"; set -pu window-style; set -pu window-active-style'

# ==========================================
# フォアグラウンド / バックグラウンド制御 (Advanced Pane Management)
# ==========================================

# ペインの切り離し (Break) -> 現在のペインを新しいバックグラウンドウィンドウにする
# デフォルトの「Prefix + !」を押しやすい「Prefix + b」に変更
bind b break-pane -d

# ペインの結合 (Join) -> 指定したウィンドウを現在のペインの隣に引っ張り出す
# Prefix + g でどのウィンドウを結合するか選択肢を表示する
bind g choose-window "join-pane -h -s "%%""

# マルチポップアップ管理のトグル
# 現在のセッション名 (#S) が 'popup_' で始まる場合は、ポップアップ内とみなして安全にデタッチする
# 通常セッションから実行された場合は、ベースとなるポップアップウィンドウを生成する
# ポップアップに丸みのある枠線とタイトルを付与して視認性を向上
bind P if-shell "tmux display-message -p '#S' | grep -q '^popup_'" \
    "detach-client" \
    "popup -d \"#{pane_current_path}\" -xC -yC -w80% -h80% -b rounded -T ' 🚀 Popup Session ' -E \"tmux attach-session -t popup_main || tmux new-session -s popup_main\""


# ==========================================
# コピーモード設定 (Copy Mode)
# ==========================================

# コピーモード (Prefix + [) でVimのキーバインドを使用する
setw -g mode-keys vi

# コピーモード中の選択・コピー操作をVim風にする (macOSとLinuxの両対応・最適化版)
bind -T copy-mode-vi v send -X begin-selection

# copy-pipe-and-cancel から copy-pipe に変更してコピーモードを維持する
bind -T copy-mode-vi y send -X copy-pipe "if command -v pbcopy >/dev/null 2>&1; then pbcopy; else xclip -in -selection clipboard; fi"
bind -T copy-mode-vi Enter send -X copy-pipe "if command -v pbcopy >/dev/null 2>&1; then pbcopy; else xclip -in -selection clipboard; fi"

bind ] run "if command -v pbpaste >/dev/null 2>&1; then tmux set-buffer \"$(pbpaste)\"; else tmux set-buffer \"$(xclip -o -selection clipboard)\"; fi; tmux paste-buffer"

# ==========================================
# マウス設定 (Mouse)
# ==========================================

# クリックでペイン選択 / 境界線のドラッグでリサイズ / ステータスバーのウィンドウ名クリックで切り替え /
# ホイールで履歴をスクロール / ドラッグで範囲選択
set -g mouse on

# ドラッグ・ダブルクリック・トリプルクリックの選択も y と同じクリップボードに送る
# (デフォルトは tmux のバッファに入るだけで、xclip / pbcopy には届かない)
# copy-command は、コマンド無しの copy-pipe(-and-cancel) が使うコマンドで、tmux 3.2 以降で使える。
# マウス用の各バインドを上書きしなくても、ドラッグ・ダブル/トリプルクリックの全てに効く
# (y / Enter は上で明示的にコマンドを指定しているので影響しない)
set -g copy-command "if command -v pbcopy >/dev/null 2>&1; then pbcopy; else xclip -in -selection clipboard; fi"

# Prefix + M でマウスのオン/オフを切り替える (オフにするとターミナル本来の選択が使える)
bind M set -g mouse \; display "mouse: #{?mouse,on,off}"

# ==========================================
# ペインの見た目 (Pane Appearance)
# ==========================================

# 境界線を太線にして、非アクティブは明るめの灰色、アクティブは明るい青にする
# (アクティブの色は、コピーモード中は黄色、synchronize-panes 中は赤になる tmux 標準の状態表示を残している)
set -g pane-border-lines heavy
set -g pane-border-style fg=colour245
set -g pane-active-border-style "#{?pane_in_mode,fg=colour220,#{?synchronize-panes,fg=colour196,fg=colour39}}"

# 非アクティブなペインの文字を灰色にして、アクティブなペインを際立たせる
# 背景色は指定しない: 背景色を指定した部分は、端末の透過 (透明・ぼかし) が効かなくなるため
# window-active-style の fg=default は「上書きしない」という意味になり、window-style の色が
# アクティブなペインにも残ってしまうため、アクティブ側は fg=terminal (端末の標準の文字色) と明示する
# (ls や vim など、自分で色を付けて表示するアプリの文字は、この設定では変わらない)
set -g window-style fg=colour245
set -g window-active-style fg=terminal

# 端末ウィンドウ自体がフォーカスを失ったときの見た目は、一番下の「端末のフォーカス」で設定している

# ==========================================
# 外観・ステータスバー (Status Bar Appearance)
# ==========================================

# ステータスバーの色を設定
set -g status-style bg=black,fg=white

# プレフィックスキーが押されている間、[#S] の色を反転させるなどの視覚効果を追加
set -g status-left "#{?client_prefix,#[fg=black]#[bg=yellow],#[fg=green]}[#S]#[default] "
set -g status-left-length 20

# システムモニタ (CPU / MEM / 温度 / DISK / NET / BAT) を更新する間隔 (秒)
set -g status-interval 5

# 右側の表示 (システムモニタ + 日時)
# モニタの中身は tmux/status.sh (~/.local/bin/tmux-status として配置される)
# 値が正常な項目は自動で非表示になる。しきい値は status.sh の先頭で調整する
# status-right-length はデフォルト(40)だと切り詰められるため広げる
set -g status-right-length 100
set -g status-right "#($HOME/.local/bin/tmux-status)#[fg=cyan]%Y-%m-%d %H:%M"

# GNOME などのデスクトップ通知のうち、まだ閉じられていないものの件数を、status.sh が赤い点と件数で表示する (Linux のみ)
# tmux/notify.py (~/.local/bin/tmux-notify として配置される) が通知を監視して件数をファイルに書き出す。
# 通知をクリックしたり消したりすると、件数は減る。
# 通知の内容は表示も保存もしない。この tmux が終了すると、監視も自動で終了する (常駐サービスにはしない)。
# 多重起動はスクリプト側で防ぐので、設定の再読み込み (Prefix + r) をしても増えない。
# 未配置の環境や、通知の監視ができない環境 (macOS など) では、何もせずに終わる
run-shell -b "[ -x $HOME/.local/bin/tmux-notify ] && $HOME/.local/bin/tmux-notify || true"

# 通知の件数をまとめて 0 に戻す: Prefix + N、またはステータスバーの赤い点をクリック
# (通知を1つずつクリックして消すと、その分だけ自動で減る)
# range=user|X の範囲 (status.sh が赤い点に付けている) のクリックは、ウィンドウ名のクリックと同じ
# MouseDown1Status になる。ウィンドウ名のクリックでの切り替え (標準の switch-client -t =) は else で残す
bind N run-shell -b "[ -x $HOME/.local/bin/tmux-notify ] && $HOME/.local/bin/tmux-notify --clear || true"
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},notify}' 'run-shell -b "[ -x $HOME/.local/bin/tmux-notify ] && $HOME/.local/bin/tmux-notify --clear || true"' 'switch-client -t ='

# アクティブなウィンドウを目立たせる
setw -g window-status-current-style bg=blue,fg=white,bold

# ==========================================
# 端末のフォーカス (Terminal Focus)
# ==========================================

# 端末ウィンドウ自体がフォーカスを失ったときは、画面全体を灰色にして、フォーカスが戻ったら元に戻す
# (どのペインも操作の対象ではない状態だと分かるようにする)
#   - アクティブなペインの文字: 非アクティブなペインと同じ灰色
#   - ペインの境界線: アクティブ側も非アクティブと同じ灰色 (どれがアクティブかは分からなくなる)
#   - ステータスバー: 背景を灰色にして、文字と現在のウィンドウ名も灰色
# フォーカスの出入りは focus-events on (上の基本設定) で端末から受け取る。
# focus-in 側の値は、上で設定した値と同じにしておくこと
# (window-active-style / pane-active-border-style / status-style / window-status-current-style)
# 文字色を直接指定している部分 (セッション名、日時、警告中のモニタ項目、通知の赤い点) は灰色にならない
set-hook -g client-focus-out "\
    set -g window-active-style fg=colour245; \
    set -g pane-active-border-style fg=colour245; \
    set -g status-style bg=colour238,fg=colour245; \
    setw -g window-status-current-style bg=colour245,fg=black,bold"
set-hook -g client-focus-in "\
    set -g window-active-style fg=terminal; \
    set -g pane-active-border-style '#{?pane_in_mode,fg=colour220,#{?synchronize-panes,fg=colour196,fg=colour39}}'; \
    set -g status-style bg=black,fg=white; \
    setw -g window-status-current-style bg=blue,fg=white,bold"
