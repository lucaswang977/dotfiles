# ==========================================
# 基本設定 (General Settings)
# ==========================================

# スクロールバックバッファの行数を増やす
set -g history-limit 10000

# ウィンドウやペインのインデックスを1から開始する (キーボードの1キーに合わせるため)
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウが閉じられたらインデックスを自動で詰め重す
set -g renumber-windows on

# 端末のカラー設定 (256色・TrueColor対応)
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# フォーカスイベントを有効化 (Neovimなどのautoreadと連携するため)
set -g focus-events on


# ==========================================
# キーバインド設定 (Key Bindings)
# ==========================================

# プレフィックスキーを Ctrl + b から Ctrl + a に変更 (押しやすさ重視)
set -g prefix C-a
unbind C-b

# Ctrl + a を2回連続で押すことで、直前のアクティブなウィンドウ(タブ)と交互に切り替える
bind C-a last-window

# 設定ファイルの再読み込みショートカット
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# 直感的な画面分割 (現在のペインのパスを引き継ぐ)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim風のキーバインドでペインを移動する (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim風のキーバインドでペインをリサイズする (Prefix + H/J/K/L)
# -r オプションにより、Prefixを一度押せば連続で入力可能
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# Prefix + c で現在のディレクトリを引き継いで新しいウィンドウを作成する
bind c new-window -c "#{pane_current_path}"

# ==========================================
# フォアグラウンド / バックグラウンド制御 (Advanced Pane Management)
# ==========================================

# ペインの切り離し (Break) -> 現在のペインを新しいバックグラウンドウィンドウにする
# デフォルトの「Prefix + !」を押しやすい「Prefix + b」に変更
bind b break-pane -d

# ペインの結合 (Join) -> 指定したウィンドウを現在のペインの隣に引っ張り出す
# Prefix + g でどのウィンドウを結合するか選択肢を表示する
bind g choose-window "join-pane -h -s "%%""

# マルチポップアップ管理のトグル
# 現在のセッション名 (#S) が 'popup_' で始まる場合は、ポップアップ内とみなして安全にデタッチする
# 通常セッションから実行された場合は、ベースとなるポップアップウィンドウを生成する
bind P if-shell "tmux display-message -p '#S' | grep -q '^popup_'" \
    "detach-client" \
    "popup -d \"#{pane_current_path}\" -xC -yC -w80% -h80% -E \"tmux attach-session -t popup_main || tmux new-session -s popup_main\""


# ==========================================
# コピーモード設定 (Copy Mode - No Mouse)
# ==========================================

# コピーモード (Prefix + [) でVimのキーバインドを使用する
setw -g mode-keys vi

# コピーモード中の選択・コピー操作をVim風にする (macOSとLinuxの両対応・最適化版)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "if command -v pbcopy >/dev/null 2>&1; then pbcopy; else xclip -in -selection clipboard; fi"
bind ] run "if command -v pbpaste >/dev/null 2>&1; then tmux set-buffer \"$(pbpaste)\"; else tmux set-buffer \"$(xclip -o -selection clipboard)\"; fi; tmux paste-buffer"

# ==========================================
# 外観・ステータスバー (Status Bar Appearance)
# ==========================================

# ステータスバーの色を設定
set -g status-style bg=black,fg=white

# 左側の表示 (セッション名)
set -g status-left "#[fg=green][#S] "
set -g status-left-length 20

# 右側の表示 (日時)
set -g status-right "#[fg=cyan]%Y-%m-%d %H:%M"

# アクティブなウィンドウを目立たせる
setw -g window-status-current-style bg=blue,fg=white,bold
